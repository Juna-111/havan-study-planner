name: Havan CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: havan
          POSTGRES_PASSWORD: havan
          POSTGRES_DB: havan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U havan -d havan_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://havan:havan@localhost:5432/havan_test
      AUTH_SECRET: ci-only-secret-not-for-production
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q app database tests
      - name: Check migration heads
        working-directory: backend
        run: alembic heads
      - name: Upgrade scratch database
        working-directory: backend
        run: alembic upgrade head
      - name: Roll back newest migration and upgrade again
        working-directory: backend
        run: alembic downgrade 20261007_09 && alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit -p frontend
      - name: Test
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://havan-study-planner.onrender.com
        run: npm run build
      - name: Structure and hygiene
        run: npm run check:structure
